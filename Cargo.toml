[package]
name = "dbuni"
version = "0.1.0"
edition = "2024"
authors = ["happyboy <superhappyboy1995@gmail.com>"]
description = "A unified database abstraction layer."
keywords = ["database", "abstraction", "sql", "nosql", "adapter"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/0xhappyboy/dbuni"

[dependencies]
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "mysql",
    "postgres",
    "sqlite",
] }
redis = { version = "1.7.1", features = [
    "aio",
    "tokio-comp",
    "connection-manager",
] }
mongodb = "3.9.1"
serde_json = "1.0.154"
futures-util = "0.3.34"
