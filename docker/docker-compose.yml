services:
  mysql:
    image: mysql:8.4
    container_name: dbuni-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: testdb
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - dbuni_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot123456",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.4
    container_name: dbuni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - redis123456
      - --appendonly
      - "yes"
    volumes:
      - dbuni_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  dbuni_mysql_data:
  dbuni_redis_data:
