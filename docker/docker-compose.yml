services:
  mysql:
    image: mysql:8.4
    container_name: dbuni-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: testdb
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - dbuni_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot123456",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.4
    container_name: dbuni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - redis123456
      - --appendonly
      - "yes"
    volumes:
      - dbuni_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  postgres:
    image: postgres:17
    container_name: dbuni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123456
      POSTGRES_DB: testdb
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - dbuni_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "testdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  mongodb:
    image: mongo:8
    container_name: dbuni-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123456
      MONGO_INITDB_DATABASE: testdb
      TZ: UTC
    ports:
      - "27017:27017"
    volumes:
      - dbuni_mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "root123456",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
volumes:
  dbuni_mysql_data:
  dbuni_redis_data:
  dbuni_postgres_data:
  dbuni_mongodb_data:
